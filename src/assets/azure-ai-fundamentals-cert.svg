<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111d40"/>
      <stop offset="100%" stop-color="#1a2b5c"/>
    </linearGradient>
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="700" fill="#ffffff" />

  <!-- Top Dark Blue Header Banner -->
  <rect width="1000" height="230" fill="#141c3a" />
  
  <text x="60" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="600" fill="#ffffff">Microsoft Certified</text>
  <text x="60" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="400" fill="#ffffff">Azure AI Fundamentals</text>

  <!-- Recipient & Content -->
  <text x="60" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="600" fill="#0f172a">Vishwa Venkadachalam</text>
  
  <text x="60" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#64748b">has successfully completed the requirements of</text>
  <text x="60" y="398" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#1e293b">Azure AI Fundamentals</text>

  <text x="60" y="470" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#334155">Date Issued: <tspan font-weight="600" fill="#0f172a">April 10, 2026</tspan></text>

  <!-- Microsoft Grid Logo (Bottom Left) -->
  <g transform="translate(60, 580)">
    <rect x="0" y="0" width="18" height="18" fill="#f25022"/>
    <rect x="22" y="0" width="18" height="18" fill="#7fba00"/>
    <rect x="0" y="22" width="18" height="18" fill="#00a4ef"/>
    <rect x="22" y="22" width="18" height="18" fill="#ffb900"/>
    <text x="50" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#5e5e5e">Microsoft</text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(560, 520)">
    <path d="M 10,35 Q 30,10 60,30 T 110,25 Q 140,40 170,20 Q 190,15 210,30" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="10" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Satya Nadella</text>
    <text x="10" y="83" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748b">Chief Executive Officer</text>
  </g>

  <!-- Microsoft Certified Fundamentals Shield Badge -->
  <g transform="translate(790, 430)">
    <!-- Shield Outline -->
    <path d="M 0,20 L 70,0 L 140,20 L 140,90 C 140,140 70,175 70,175 C 70,175 0,140 0,90 Z" fill="#0f2b5c" stroke="#ffffff" stroke-width="3"/>
    <rect x="10" y="30" width="120" height="35" fill="#ffffff" rx="4"/>
    <text x="70" y="46" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f2b5c" text-anchor="middle">Microsoft</text>
    <text x="70" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0f2b5c" text-anchor="middle">CERTIFIED</text>
    
    <text x="70" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">FUNDAMENTALS</text>
    
    <!-- Star -->
    <polygon points="70,112 73,122 83,122 75,128 78,138 70,132 62,138 65,128 57,122 67,122" fill="#ffffff"/>
  </g>

  <!-- Bottom Dark Blue Footer Bar -->
  <rect x="0" y="650" width="1000" height="50" fill="#141c3a" />
  <text x="940" y="680" font-family="'Segoe UI', Roboto, font-mono, sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="end">verify.certiport.com: MqV5-s4wW</text>
</svg>
